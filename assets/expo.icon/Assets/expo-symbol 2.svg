<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152F"/>
      <stop offset="1" stop-color="#020A1D"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677FF"/>
      <stop offset="1" stop-color="#0054E8"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="1024" height="1024" rx="190" fill="url(#bg)"/>

  <!-- Scanner corner brackets -->
  <g fill="none" stroke="#11BFF2" stroke-width="48" stroke-linecap="round">
    <path d="M118 270V185Q118 135 168 135H270"/>
    <path d="M754 135H856Q906 135 906 185V270"/>
    <path d="M118 754V839Q118 889 168 889H270"/>
    <path d="M754 889H856Q906 889 906 839V754"/>
  </g>

  <!-- QR code modules -->
  <g fill="white">
    <!-- top-left finder -->
    <rect x="205" y="205" width="235" height="235" rx="10"/>
    <rect x="255" y="255" width="135" height="135" rx="5" fill="#07152F"/>

    <!-- top-right finder -->
    <rect x="584" y="205" width="235" height="235" rx="10"/>
    <rect x="634" y="255" width="135" height="135" rx="5" fill="#07152F"/>

    <!-- bottom-left finder -->
    <rect x="205" y="584" width="235" height="235" rx="10"/>
    <rect x="255" y="634" width="135" height="135" rx="5" fill="#07152F"/>

    <!-- QR data modules -->
    <rect x="475" y="210" width="48" height="48" rx="7"/>
    <rect x="535" y="270" width="48" height="48" rx="7"/>
    <rect x="475" y="330" width="48" height="48" rx="7"/>
    <rect x="535" y="390" width="48" height="48" rx="7"/>
    <rect x="705" y="475" width="48" height="48" rx="7"/>
    <rect x="765" y="475" width="48" height="48" rx="7"/>
    <rect x="475" y="475" width="48" height="48" rx="7"/>
    <rect x="535" y="475" width="48" height="48" rx="7"/>
    <rect x="595" y="475" width="48" height="48" rx="7"/>
    <rect x="655" y="535" width="48" height="48" rx="7"/>
    <rect x="715" y="595" width="48" height="48" rx="7"/>
    <rect x="775" y="655" width="48" height="48" rx="7"/>
    <rect x="475" y="595" width="48" height="48" rx="7"/>
    <rect x="535" y="655" width="48" height="48" rx="7"/>
    <rect x="595" y="715" width="48" height="48" rx="7"/>
    <rect x="655" y="655" width="48" height="48" rx="7"/>
    <rect x="715" y="715" width="48" height="48" rx="7"/>
    <rect x="775" y="535" width="48" height="48" rx="7"/>
  </g>

  <!-- Scan beam -->
  <rect x="80" y="490" width="864" height="44" rx="22" fill="#11BFF2"/>

  <!-- J.Y. badge -->
  <circle cx="512" cy="512" r="146" fill="url(#blue)" stroke="white" stroke-width="14"/>
  <text x="512" y="555" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112" font-weight="700" letter-spacing="2"
        fill="white">J.Y.</text>
</svg>